name: Build

# Reusable: builds the core, the TV app and the remote, and optionally uploads
# them as archives. Called by CI (Linux only), CD and Release (all platforms).
on:
  workflow_call:
    inputs:
      all-platforms:
        description: Build Linux, macOS and Windows (otherwise Linux only)
        type: boolean
        default: false
      upload:
        description: Upload the archives as workflow artifacts
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Core and TV app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.all-platforms && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned Flutter version
        id: versions
        run: |
          echo "flutter=$(sed -n 's/^flutter = "\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.versions.outputs.flutter }}
          channel: stable
          cache: true

      - name: Build the core
        run: cargo build --release --locked -p teloche-core

      - name: Build the TV app
        run: |
          flutter pub get --enforce-lockfile
          cd apps/tv
          case "$RUNNER_OS" in
            Linux) flutter build linux --release ;;
            macOS) flutter build macos --release ;;
            Windows) flutter build windows --release ;;
          esac

      - name: Archive
        if: inputs.upload
        run: |
          mkdir dist
          case "$RUNNER_OS" in
            Linux)
              tar -czf dist/teloche-core-linux-x64.tar.gz -C target/release teloche-core
              tar -czf dist/teloche-tv-linux-x64.tar.gz -C apps/tv/build/linux/x64/release/bundle . ;;
            macOS)
              tar -czf dist/teloche-core-macos-arm64.tar.gz -C target/release teloche-core
              ditto -c -k --keepParent apps/tv/build/macos/Build/Products/Release/teloche_tv.app dist/teloche-tv-macos.zip ;;
            Windows)
              7z a dist/teloche-core-windows-x64.zip ./target/release/teloche-core.exe
              7z a dist/teloche-tv-windows-x64.zip ./apps/tv/build/windows/x64/runner/Release/* ;;
          esac

      - uses: actions/upload-artifact@v7
        if: inputs.upload
        with:
          name: desktop-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  remote:
    name: Remote (Android APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned Flutter version
        id: versions
        run: echo "flutter=$(sed -n 's/^flutter = "\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.versions.outputs.flutter }}
          channel: stable
          cache: true
      - name: Build the APK
        run: |
          flutter pub get --enforce-lockfile
          cd apps/remote
          flutter build apk --release
          mkdir -p ../../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../../dist/teloche-remote-android.apk
      - uses: actions/upload-artifact@v7
        if: inputs.upload
        with:
          name: remote-android
          path: dist/*
          if-no-files-found: error
