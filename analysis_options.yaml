# Shared by every Dart and Flutter package of the repository.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/build/**"
    - "**/*.g.dart"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures

formatter:
  page_width: 120
